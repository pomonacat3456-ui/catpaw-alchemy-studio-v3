stages: [scan, test]

secret-scan:
  stage: scan
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache curl git tar
    - curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
    - ./gitleaks git . --redact --no-banner --exit-code 1

test:
  stage: test
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
# No deploy job on purpose: deploys are manual (wrangler, owner's Cloudflare account).
